<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Matcher & Candidate Ranking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & Babel for standalone browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper to format scores
    const getScoreBadgeClass = (score) => {
      if (score >= 80) return "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      if (score >= 65) return "bg-blue-500/10 text-blue-400 border border-blue-500/20";
      if (score >= 50) return "bg-amber-500/10 text-amber-400 border border-amber-500/20";
      return "bg-rose-500/10 text-rose-400 border border-rose-500/20";
    };

    function App() {
      // System state
      const [health, setHealth] = useState(null);
      const [sampleJDs, setSampleJDs] = useState([]);
      const [activeTab, setActiveTab] = useState("match"); // 'jd', 'resumes', 'match', 'ranking'

      // Module 1: Job Description
      const [jdText, setJdText] = useState("");
      const [selectedJdId, setSelectedJdId] = useState("jd-1");
      const [parsedJD, setParsedJD] = useState(null);
      const [isParsingJD, setIsParsingJD] = useState(false);

      // Module 2: Resumes
      const [uploadedResumes, setUploadedResumes] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState("");

      // Module 3 & 4: Matching & Ranking
      const [rankedCandidates, setRankedCandidates] = useState([]);
      const [isMatching, setIsMatching] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [sortField, setSortField] = useState("rank");
      const [sortAsc, setSortAsc] = useState(true);

      // Module 5: Candidate Deep-Dive Modal
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [candidateModalTab, setCandidateModalTab] = useState("analysis");

      // Matching Weights
      const [weights, setWeights] = useState({
        skills: 0.45,
        semantic: 0.35,
        experience: 0.15,
        education: 0.05
      });
      const [showWeightsConfig, setShowWeightsConfig] = useState(false);

      // Fetch health and initial sample JDs
      useEffect(() => {
        fetch("/api/health")
          .then(res => res.json())
          .then(data => setHealth(data))
          .catch(err => console.error("Health check error:", err));

        fetch("/api/samples/jds")
          .then(res => res.json())
          .then(data => {
            if (data.job_descriptions && data.job_descriptions.length > 0) {
              setSampleJDs(data.job_descriptions);
              setJdText(data.job_descriptions[0].text);
            }
          })
          .catch(err => console.error("Sample JDs error:", err));
      }, []);

      // Trigger icons rendering after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Quick load preset JD
      const handleSelectPresetJD = (id) => {
        const jd = sampleJDs.find(j => j.id === id);
        if (jd) {
          setSelectedJdId(id);
          setJdText(jd.text);
          setParsedJD(null);
        }
      };

      // Module 1: Analyze Job Description
      const handleAnalyzeJD = async () => {
        if (!jdText.trim()) return;
        setIsParsingJD(true);
        try {
          const res = await fetch("/api/jd/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: jdText })
          });
          const data = await res.json();
          if (data.job_description) {
            setParsedJD(data.job_description);
          }
        } catch (err) {
          alert("Error parsing JD: " + err.message);
        } finally {
          setIsParsingJD(false);
        }
      };

      // Upload JD file
      const handleJDFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append("file", file);
        setIsParsingJD(true);
        try {
          const res = await fetch("/api/jd/upload", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.job_description) {
            setParsedJD(data.job_description);
            setJdText(data.job_description.raw_text);
          }
        } catch (err) {
          alert("Upload failed: " + err.message);
        } finally {
          setIsParsingJD(false);
        }
      };

      // Module 2: Upload batch resumes
      const handleResumeBatchUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        setIsUploading(true);
        setUploadProgress(`Processing ${files.length} resumes (PDF & DOCX)...`);
        const formData = new FormData();
        files.forEach(f => formData.append("files", f));

        try {
          const res = await fetch("/api/resumes/upload-batch", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.resumes) {
            setUploadedResumes(prev => [...prev, ...data.resumes]);
            setUploadProgress(`Successfully parsed ${data.resumes.length} resumes.`);
          }
        } catch (err) {
          alert("Batch upload error: " + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      // 1-Click Demo Loader: Load 12 Pre-generated Synthetic Resumes & Match
      const handleLoadDemoDataset = async (presetId = selectedJdId) => {
        setIsMatching(true);
        try {
          const res = await fetch(`/api/samples/load-preloaded?jd_id=${presetId}`);
          const data = await res.json();
          if (data.ranking) {
            setParsedJD(data.job_description);
            setJdText(data.job_description.raw_text);
            setUploadedResumes(data.ranking.map(r => ({
              filename: r.filename,
              name: r.name,
              email: r.email,
              phone: r.phone,
              education: r.education,
              experience_years: r.experience_years,
              skills: r.all_skills,
              summary: r.summary,
              raw_text: r.raw_text
            })));
            setRankedCandidates(data.ranking);
            setActiveTab("ranking");
          }
        } catch (err) {
          alert("Error loading demo dataset: " + err.message);
        } finally {
          setIsMatching(false);
        }
      };

      // Run AI Match
      const handleRunMatching = async () => {
        if (!parsedJD && !jdText.trim()) {
          alert("Please provide and analyze a Job Description first.");
          return;
        }
        if (uploadedResumes.length === 0) {
          alert("Please upload at least 1 resume or load the sample resumes.");
          return;
        }

        setIsMatching(true);
        try {
          // If JD not parsed yet, parse it on the fly
          let targetJD = parsedJD;
          if (!targetJD) {
            const jdRes = await fetch("/api/jd/analyze", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: jdText })
            });
            const jdData = await jdRes.json();
            targetJD = jdData.job_description;
            setParsedJD(targetJD);
          }

          const matchRes = await fetch("/api/match", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jd: targetJD,
              resumes: uploadedResumes,
              weights: weights
            })
          });
          const matchData = await matchRes.json();
          if (matchData.ranking) {
            setRankedCandidates(matchData.ranking);
            setActiveTab("ranking");
          }
        } catch (err) {
          alert("Matching computation failed: " + err.message);
        } finally {
          setIsMatching(false);
        }
      };

      // Export ranked results to CSV
      const handleExportCSV = () => {
        if (rankedCandidates.length === 0) return;
        const headers = ["Rank", "Candidate Name", "Match %", "Experience", "Matched Skills", "Missing Skills", "Email", "Phone", "Tier"];
        const rows = rankedCandidates.map(c => [
          c.rank,
          `"${c.name}"`,
          `${c.match_percentage}%`,
          `"${c.experience_display}"`,
          `"${c.matched_skills.join(', ')}"`,
          `"${c.missing_skills.join(', ')}"`,
          c.email,
          c.phone,
          `"${c.explanation?.tier || ''}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Candidate_Ranking_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Filtering & Sorting
      const filteredCandidates = useMemo(() => {
        let list = [...rankedCandidates];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(c => 
            c.name.toLowerCase().includes(q) ||
            c.matched_skills.some(s => s.toLowerCase().includes(q)) ||
            (c.email && c.email.toLowerCase().includes(q))
          );
        }
        list.sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (sortField === "match_percentage" || sortField === "experience_years" || sortField === "rank") {
            return sortAsc ? valA - valB : valB - valA;
          }
          valA = (valA || "").toString().toLowerCase();
          valB = (valB || "").toString().toLowerCase();
          return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
        return list;
      }, [rankedCandidates, searchQuery, sortField, sortAsc]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="glass-nav sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i data-lucide="sparkles" className="w-5 h-5 text-white"></i>
              </div>
              <div>
                <h1 className="text-lg font-bold text-white tracking-tight flex items-center space-x-2">
                  <span>MatchWise AI</span>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">NLP & Embeddings</span>
                </h1>
                <p className="text-xs text-slate-400">AI-Based Resume Matching & Candidate Ranking Platform</p>
              </div>
            </div>

            {/* Model & Demo Shortcut */}
            <div className="flex items-center space-x-4">
              <div className="hidden md:flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-300">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>AI Engine:</span>
                <span className="font-mono text-blue-400 font-medium">Sentence-Transformers (all-MiniLM-L6-v2)</span>
              </div>

              <button
                onClick={() => handleLoadDemoDataset("jd-1")}
                className="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-lg font-medium text-xs shadow-lg shadow-blue-600/20 flex items-center space-x-2 transition-all cursor-pointer"
              >
                <i data-lucide="play" className="w-4 h-4 fill-white"></i>
                <span>Load 12 Sample Resumes & Demo</span>
              </button>
            </div>
          </header>

          {/* Navigation Bar */}
          <div className="border-b border-slate-800/80 bg-slate-950/40 px-6">
            <div className="flex space-x-6">
              {[
                { id: "jd", label: "1. Job Description", icon: "file-text", badge: parsedJD ? "Analyzed" : null },
                { id: "resumes", label: "2. Batch Resumes", icon: "upload-cloud", badge: uploadedResumes.length > 0 ? `${uploadedResumes.length} Uploaded` : null },
                { id: "match", label: "3. Matching Config", icon: "cpu", badge: null },
                { id: "ranking", label: "4. Candidate Ranking", icon: "bar-chart-3", badge: rankedCandidates.length > 0 ? `${rankedCandidates.length} Ranked` : null }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-3.5 px-1 border-b-2 font-medium text-sm flex items-center space-x-2 transition-colors cursor-pointer ${
                    activeTab === tab.id
                      ? "border-blue-500 text-blue-400 font-semibold"
                      : "border-transparent text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  <span>{tab.label}</span>
                  {tab.badge && (
                    <span className="text-[10px] bg-slate-800 text-blue-300 px-2 py-0.5 rounded-full border border-slate-700">
                      {tab.badge}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* Main Content Area */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            
            {/* TAB 1: JOB DESCRIPTION INPUT */}
            {activeTab === "jd" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 space-y-4">
                  <div className="glass-card p-5 rounded-2xl">
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center space-x-2">
                        <i data-lucide="file-edit" className="w-5 h-5 text-blue-400"></i>
                        <h2 className="text-base font-semibold text-white">Paste or Edit Job Description</h2>
                      </div>
                      
                      {/* File upload input */}
                      <label className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer flex items-center space-x-1.5 transition-colors">
                        <i data-lucide="upload" className="w-3.5 h-3.5"></i>
                        <span>Upload JD (PDF/DOCX)</span>
                        <input type="file" accept=".pdf,.docx,.txt" className="hidden" onChange={handleJDFileUpload} />
                      </label>
                    </div>

                    {/* Preset selection pills */}
                    <div className="mb-3 flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
                      <span className="text-slate-400 whitespace-nowrap">Load Preset Role:</span>
                      {sampleJDs.map(jd => (
                        <button
                          key={jd.id}
                          onClick={() => handleSelectPresetJD(jd.id)}
                          className={`px-3 py-1 rounded-md transition-all whitespace-nowrap cursor-pointer ${
                            selectedJdId === jd.id
                              ? "bg-blue-600/30 text-blue-300 border border-blue-500/40 font-medium"
                              : "bg-slate-800/80 text-slate-400 hover:text-slate-200 border border-slate-700"
                          }`}
                        >
                          {jd.title}
                        </button>
                      ))}
                    </div>

                    <textarea
                      value={jdText}
                      onChange={(e) => setJdText(e.target.value)}
                      placeholder="Paste Job Description text here..."
                      rows={14}
                      className="w-full bg-slate-900/90 text-slate-200 text-xs sm:text-sm font-mono p-4 rounded-xl border border-slate-800 focus:outline-none focus:border-blue-500 resize-none custom-scrollbar"
                    ></textarea>

                    <div className="mt-4 flex justify-end">
                      <button
                        onClick={handleAnalyzeJD}
                        disabled={isParsingJD || !jdText.trim()}
                        className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-xl text-sm font-medium flex items-center space-x-2 shadow-lg shadow-blue-600/20 transition-all cursor-pointer"
                      >
                        {isParsingJD ? (
                          <>
                            <div className="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                            <span>Extracting Requirements...</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="zap" className="w-4 h-4"></i>
                            <span>Analyze Job Description & Extract Requirements</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Extracted JD Info Card */}
                <div className="space-y-4">
                  <div className="glass-card p-5 rounded-2xl h-full flex flex-col">
                    <div className="flex items-center space-x-2 mb-4">
                      <i data-lucide="check-circle-2" className="w-5 h-5 text-emerald-400"></i>
                      <h3 className="text-base font-semibold text-white">Extracted JD Requirements</h3>
                    </div>

                    {parsedJD ? (
                      <div className="space-y-5 flex-1 text-xs">
                        <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                          <span className="text-slate-400 uppercase tracking-wider text-[10px] font-semibold block mb-1">Target Position</span>
                          <span className="text-sm font-bold text-white block">{parsedJD.title}</span>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <span className="text-slate-400 uppercase tracking-wider text-[10px] font-semibold block mb-1">Required Exp</span>
                            <span className="text-sm font-bold text-blue-400">{parsedJD.min_experience_years}+ Years</span>
                          </div>
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <span className="text-slate-400 uppercase tracking-wider text-[10px] font-semibold block mb-1">Education</span>
                            <span className="text-sm font-bold text-indigo-400 truncate">{parsedJD.required_education}</span>
                          </div>
                        </div>

                        <div>
                          <span className="text-slate-400 uppercase tracking-wider text-[10px] font-semibold block mb-2">
                            Extracted Skills ({parsedJD.required_skills?.length || 0})
                          </span>
                          <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scrollbar p-1">
                            {parsedJD.required_skills?.map((skill, idx) => (
                              <span key={idx} className="bg-blue-900/30 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded-md font-medium">
                                {skill}
                              </span>
                            ))}
                          </div>
                        </div>

                        {parsedJD.responsibilities && parsedJD.responsibilities.length > 0 && (
                          <div>
                            <span className="text-slate-400 uppercase tracking-wider text-[10px] font-semibold block mb-2">Key Responsibilities</span>
                            <ul className="space-y-1.5 text-slate-300 text-[11px] max-h-36 overflow-y-auto custom-scrollbar">
                              {parsedJD.responsibilities.map((r, i) => (
                                <li key={i} className="flex items-start space-x-2">
                                  <span className="text-blue-500 font-bold">•</span>
                                  <span>{r}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}

                        <div className="pt-2">
                          <button
                            onClick={() => setActiveTab("resumes")}
                            className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-blue-300 rounded-lg font-medium text-xs flex items-center justify-center space-x-1 border border-slate-700 cursor-pointer"
                          >
                            <span>Proceed to Resume Upload</span>
                            <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-500">
                        <i data-lucide="file-question" className="w-12 h-12 text-slate-600 mb-2"></i>
                        <p className="text-sm">Click "Analyze Job Description" to extract structured requirements and skills ontology.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: RESUME BATCH UPLOAD */}
            {activeTab === "resumes" && (
              <div className="space-y-6">
                <div className="glass-card p-6 rounded-2xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                      <h2 className="text-base font-semibold text-white flex items-center space-x-2">
                        <span>Batch Resume Upload (PDF & DOCX)</span>
                        <span className="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700">
                          Min 10 Resumes Supported
                        </span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">Upload candidate resumes in batch. The system automatically parses names, emails, experience durations, and technical competencies.</p>
                    </div>

                    <div className="flex items-center space-x-3">
                      <button
                        onClick={() => handleLoadDemoDataset(selectedJdId)}
                        className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-blue-300 border border-slate-700 rounded-xl text-xs font-medium flex items-center space-x-2 transition-all cursor-pointer"
                      >
                        <i data-lucide="files" className="w-4 h-4"></i>
                        <span>Load 12 Sample Resumes</span>
                      </button>
                      {uploadedResumes.length > 0 && (
                        <button
                          onClick={() => setUploadedResumes([])}
                          className="px-3 py-2 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 rounded-xl text-xs font-medium transition-all cursor-pointer"
                        >
                          Clear
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Drag-and-drop / File upload zone */}
                  <label className="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition-colors bg-slate-900/40 group">

                  <div className="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6 text-xs">
                    
                    {candidateModalTab === "analysis" && (
                      <>
                        {/* Score Breakdown Cards */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                            <span className="text-slate-400 text-[10px] uppercase font-semibold block mb-1">Skill Match</span>
                            <span className="text-lg font-bold text-emerald-400">
                              {selectedCandidate.explanation?.metrics_breakdown?.skill_match_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-500 block mt-0.5">Weight: 45%</span>
                          </div>

                          <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                            <span className="text-slate-400 text-[10px] uppercase font-semibold block mb-1">Semantic Relevance</span>
                            <span className="text-lg font-bold text-blue-400">
                              {selectedCandidate.explanation?.metrics_breakdown?.semantic_similarity_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-500 block mt-0.5">SentenceTransformers (35%)</span>
                          </div>

                          <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                            <span className="text-slate-400 text-[10px] uppercase font-semibold block mb-1">Experience Alignment</span>
                            <span className="text-lg font-bold text-amber-400">
                              {selectedCandidate.explanation?.metrics_breakdown?.experience_alignment_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-500 block mt-0.5">Weight: 15%</span>
                          </div>

                          <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                            <span className="text-slate-400 text-[10px] uppercase font-semibold block mb-1">Education Fit</span>
                            <span className="text-lg font-bold text-purple-400">
                              {selectedCandidate.explanation?.metrics_breakdown?.education_score}%
                            </span>
                            <span className="text-[10px] text-slate-500 block mt-0.5">Weight: 5%</span>
                          </div>
                        </div>

                        {/* Experience Comparison Bar */}
                        <div className="bg-slate-950/40 p-4 rounded-xl border border-slate-800">
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-slate-300 font-semibold text-xs flex items-center space-x-1.5">
                              <i data-lucide="clock" className="w-3.5 h-3.5 text-blue-400"></i>
                              <span>Experience Comparison</span>
                            </span>
                            <span className="text-slate-400 text-[11px]">
                              Candidate: <strong className="text-white">{selectedCandidate.experience_display}</strong> vs Required: <strong className="text-blue-400">{parsedJD?.min_experience_years || 3}+ Years</strong>
                            </span>
                          </div>
                          <div className="w-full bg-slate-800 rounded-full h-3 relative overflow-hidden">
                            <div
                              className="h-full bg-blue-500 rounded-full"
                              style={{
                                width: `${Math.min(100, (selectedCandidate.experience_years / Math.max(1, (parsedJD?.min_experience_years || 3) * 1.5)) * 100)}%`
                              }}
                            ></div>
                          </div>
                        </div>

                        {/* Summary & Reasoning Behind Score (Module 5 Requirement) */}
                        <div className="space-y-4">
                          <div className="bg-blue-950/20 border border-blue-900/40 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-blue-300 font-semibold mb-1 text-xs">
                              <i data-lucide="info" className="w-4 h-4"></i>
                              <span>Executive Evaluation Summary</span>
                            </div>
                            <p className="text-slate-200 text-xs leading-relaxed">{selectedCandidate.explanation?.summary}</p>
                          </div>

                          {/* Strengths */}
                          <div className="bg-emerald-950/20 border border-emerald-900/40 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-emerald-300 font-semibold mb-2 text-xs">
                              <i data-lucide="check-circle" className="w-4 h-4"></i>
                              <span>Key Matching Strengths</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.strengths.map((str, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-300 text-xs">
                                  <span className="text-emerald-400 font-bold">•</span>
                                  <span>{str}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          {/* Gaps */}
                          <div className="bg-amber-950/20 border border-amber-900/40 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-amber-300 font-semibold mb-2 text-xs">
                              <i data-lucide="alert-triangle" className="w-4 h-4"></i>
                              <span>Identified Gaps & Missing Skills</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.gaps.map((gap, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-300 text-xs">
                                  <span className="text-amber-400 font-bold">•</span>
                                  <span>{gap}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          {/* Suggested Interview Probes */}
                          <div className="bg-purple-950/20 border border-purple-900/40 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-purple-300 font-semibold mb-2 text-xs">
                              <i data-lucide="help-circle" className="w-4 h-4"></i>
                              <span>Recommended Technical Interview Focus</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.interview_focus.map((q, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-300 text-xs">
                                  <span className="text-purple-400 font-bold">•</span>
                                  <span>{q}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      </>
                    )}

                    {candidateModalTab === "skills" && (
                      <div className="space-y-5">
                        {/* Matched Skills */}
                        <div>
                          <span className="text-emerald-400 font-semibold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="check" className="w-4 h-4"></i>
                            <span>Matched Required Skills ({selectedCandidate.matched_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.matched_skills.map((s, idx) => (
                              <span key={idx} className="bg-emerald-950/50 text-emerald-300 border border-emerald-800/50 px-3 py-1 rounded-lg text-xs font-medium">
                                ✓ {s}
                              </span>
                            ))}
                            {selectedCandidate.matched_skills.length === 0 && (
                              <span className="text-slate-500 italic">No direct matches.</span>
                            )}
                          </div>
                        </div>

                        {/* Missing Skills */}
                        <div>
                          <span className="text-rose-400 font-semibold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="x" className="w-4 h-4"></i>
                            <span>Missing Required Skills ({selectedCandidate.missing_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.missing_skills.map((s, idx) => (
                              <span key={idx} className="bg-rose-950/50 text-rose-300 border border-rose-800/50 px-3 py-1 rounded-lg text-xs font-medium">
                                ✗ {s}
                              </span>
                            ))}
                            {selectedCandidate.missing_skills.length === 0 && (
                              <span className="text-emerald-400">All required skills present!</span>
                            )}
                          </div>
                        </div>

                        {/* Bonus / Additional Skills */}
                        <div>
                          <span className="text-purple-400 font-semibold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="plus-circle" className="w-4 h-4"></i>
                            <span>Candidate Additional Skills ({selectedCandidate.bonus_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.bonus_skills.map((s, idx) => (
                              <span key={idx} className="bg-purple-950/40 text-purple-300 border border-purple-800/40 px-3 py-1 rounded-lg text-xs">
                                + {s}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {candidateModalTab === "resume" && (
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-wrap max-h-96 overflow-y-auto custom-scrollbar">
                        {selectedCandidate.raw_text || "No raw text available."}
                      </div>
                    )}

                  </div>

                  {/* Modal Footer */}
                  <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between text-xs">
                    <span className="text-slate-400">Candidate ID: {selectedCandidate.id}</span>
                    <button
                      onClick={() => setSelectedCandidate(null)}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-medium cursor-pointer"
                    >
                      Close Analysis
                    </button>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-800/80 bg-slate-950/60 py-4 px-6 text-center text-xs text-slate-500">
            AI-Based Resume Matching & Candidate Ranking System • Built with FastAPI, Sentence Transformers, and React
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
