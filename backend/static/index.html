<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchWise AI — Resume Matching & Candidate Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & Babel for standalone browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 custom-scrollbar antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const getScoreBadgeClass = (score) => {
      if (score >= 80) return "bg-emerald-50 text-emerald-700 border border-emerald-200/80";
      if (score >= 65) return "bg-indigo-50 text-indigo-700 border border-indigo-200/80";
      if (score >= 50) return "bg-amber-50 text-amber-700 border border-amber-200/80";
      return "bg-rose-50 text-rose-700 border border-rose-200/80";
    };

    function App() {
      // System state
      const [health, setHealth] = useState(null);
      const [sampleJDs, setSampleJDs] = useState([]);
      const [activeTab, setActiveTab] = useState("match"); // 'jd', 'resumes', 'match', 'ranking'

      // Module 1: Job Description
      const [jdText, setJdText] = useState("");
      const [selectedJdId, setSelectedJdId] = useState("jd-1");
      const [parsedJD, setParsedJD] = useState(null);
      const [isParsingJD, setIsParsingJD] = useState(false);

      // Module 2: Resumes
      const [uploadedResumes, setUploadedResumes] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState("");

      // Module 3 & 4: Matching & Ranking
      const [rankedCandidates, setRankedCandidates] = useState([]);
      const [isMatching, setIsMatching] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [sortField, setSortField] = useState("rank");
      const [sortAsc, setSortAsc] = useState(true);

      // Module 5: Candidate Deep-Dive Modal
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [candidateModalTab, setCandidateModalTab] = useState("analysis");

      // Matching Weights
      const [weights, setWeights] = useState({
        skills: 0.45,
        semantic: 0.35,
        experience: 0.15,
        education: 0.05
      });
      const [showWeightsConfig, setShowWeightsConfig] = useState(false);

      // Fetch health and initial sample JDs
      useEffect(() => {
        fetch("/api/health")
          .then(res => res.json())
          .then(data => setHealth(data))
          .catch(err => console.error("Health check error:", err));

        fetch("/api/samples/jds")
          .then(res => res.json())
          .then(data => {
            if (data.job_descriptions && data.job_descriptions.length > 0) {
              setSampleJDs(data.job_descriptions);
              setJdText(data.job_descriptions[0].text);
            }
          })
          .catch(err => console.error("Sample JDs error:", err));
      }, []);

      // Refresh icons on state change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Quick load preset JD
      const handleSelectPresetJD = (id) => {
        const jd = sampleJDs.find(j => j.id === id);
        if (jd) {
          setSelectedJdId(id);
          setJdText(jd.text);
          setParsedJD(null);
        }
      };

      // Module 1: Analyze Job Description
      const handleAnalyzeJD = async () => {
        if (!jdText.trim()) return;
        setIsParsingJD(true);
        try {
          const res = await fetch("/api/jd/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: jdText })
          });
          const data = await res.json();
          if (data.job_description) {
            setParsedJD(data.job_description);
          }
        } catch (err) {
          alert("Error parsing JD: " + err.message);
        } finally {
          setIsParsingJD(false);
        }
      };

      // Upload JD file
      const handleJDFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append("file", file);
        setIsParsingJD(true);
        try {
          const res = await fetch("/api/jd/upload", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.job_description) {
            setParsedJD(data.job_description);
            setJdText(data.job_description.raw_text);
          }
        } catch (err) {
          alert("Upload failed: " + err.message);
        } finally {
          setIsParsingJD(false);
        }
      };

      // Module 2: Upload batch resumes
      const handleResumeBatchUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        setIsUploading(true);
        setUploadProgress(`Processing ${files.length} resumes (PDF & DOCX)...`);
        const formData = new FormData();
        files.forEach(f => formData.append("files", f));

        try {
          const res = await fetch("/api/resumes/upload-batch", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.resumes) {
            setUploadedResumes(prev => [...prev, ...data.resumes]);
            setUploadProgress(`Successfully parsed ${data.resumes.length} resumes.`);
          }
        } catch (err) {
          alert("Batch upload error: " + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      // 1-Click Demo Loader: Load 12 Pre-generated Synthetic Resumes & Match
      const handleLoadDemoDataset = async (presetId = selectedJdId) => {
        setIsMatching(true);
        try {
          const res = await fetch(`/api/samples/load-preloaded?jd_id=${presetId}`);
          const data = await res.json();
          if (data.ranking) {
            setParsedJD(data.job_description);
            setJdText(data.job_description.raw_text);
            setUploadedResumes(data.ranking.map(r => ({
              filename: r.filename,
              name: r.name,
              email: r.email,
              phone: r.phone,
              education: r.education,
              experience_years: r.experience_years,
              skills: r.all_skills,
              summary: r.summary,
              raw_text: r.raw_text
            })));
            setRankedCandidates(data.ranking);
            setActiveTab("ranking");
          }
        } catch (err) {
          alert("Error loading demo dataset: " + err.message);
        } finally {
          setIsMatching(false);
        }
      };

      // Run AI Match
      const handleRunMatching = async () => {
        if (!parsedJD && !jdText.trim()) {
          alert("Please provide and analyze a Job Description first.");
          return;
        }
        if (uploadedResumes.length === 0) {
          alert("Please upload at least 1 resume or load the sample resumes.");
          return;
        }

        setIsMatching(true);
        try {
          let targetJD = parsedJD;
          if (!targetJD) {
            const jdRes = await fetch("/api/jd/analyze", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: jdText })
            });
            const jdData = await jdRes.json();
            targetJD = jdData.job_description;
            setParsedJD(targetJD);
          }

          const matchRes = await fetch("/api/match", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jd: targetJD,
              resumes: uploadedResumes,
              weights: weights
            })
          });
          const matchData = await matchRes.json();
          if (matchData.ranking) {
            setRankedCandidates(matchData.ranking);
            setActiveTab("ranking");
          }
        } catch (err) {
          alert("Matching computation failed: " + err.message);
        } finally {
          setIsMatching(false);
        }
      };

      // Export ranked results to CSV
      const handleExportCSV = () => {
        if (rankedCandidates.length === 0) return;
        const headers = ["Rank", "Candidate Name", "Match %", "Experience", "Matched Skills", "Missing Skills", "Email", "Phone", "Tier"];
        const rows = rankedCandidates.map(c => [
          c.rank,
          `"${c.name}"`,
          `${c.match_percentage}%`,
          `"${c.experience_display}"`,
          `"${c.matched_skills.join(', ')}"`,
          `"${c.missing_skills.join(', ')}"`,
          c.email,
          c.phone,
          `"${c.explanation?.tier || ''}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Candidate_Ranking_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Filtering & Sorting
      const filteredCandidates = useMemo(() => {
        let list = [...rankedCandidates];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(c => 
            c.name.toLowerCase().includes(q) ||
            c.matched_skills.some(s => s.toLowerCase().includes(q)) ||
            (c.email && c.email.toLowerCase().includes(q))
          );
        }
        list.sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (sortField === "match_percentage" || sortField === "experience_years" || sortField === "rank") {
            return sortAsc ? valA - valB : valB - valA;
          }
          valA = (valA || "").toString().toLowerCase();
          valB = (valB || "").toString().toLowerCase();
          return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
        return list;
      }, [rankedCandidates, searchQuery, sortField, sortAsc]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* Top Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3.5 shadow-xs">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm shadow-indigo-200">
                  <i data-lucide="sparkles" className="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-base font-bold text-slate-900 tracking-tight">MatchWise AI</span>
                    <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200/60">
                      NLP & Embeddings
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">AI-Based Resume Matching & Candidate Ranking System</p>
                </div>
              </div>

              {/* Status and Action Buttons */}
              <div className="flex items-center space-x-3">
                <div className="hidden md:flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-slate-500">Model:</span>
                  <span className="font-mono text-indigo-600 font-semibold">SentenceTransformers (all-MiniLM-L6-v2)</span>
                </div>

                <button
                  onClick={() => handleLoadDemoDataset("jd-1")}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold text-xs shadow-xs hover:shadow-md transition-all flex items-center space-x-2 cursor-pointer"
                >
                  <i data-lucide="play" className="w-3.5 h-3.5 fill-white"></i>
                  <span>Load 12 Sample Resumes & Demo</span>
                </button>
              </div>

            </div>
          </header>

          {/* Navigation Sub-Header */}
          <div className="bg-white border-b border-slate-200 px-6">
            <div className="max-w-7xl mx-auto flex space-x-8">
              {[
                { id: "jd", label: "1. Job Description", icon: "file-text", badge: parsedJD ? "Analyzed" : null },
                { id: "resumes", label: "2. Batch Resumes", icon: "upload-cloud", badge: uploadedResumes.length > 0 ? `${uploadedResumes.length} Loaded` : null },
                { id: "match", label: "3. Matching Engine", icon: "sliders", badge: null },
                { id: "ranking", label: "4. Candidate Ranking", icon: "bar-chart-3", badge: rankedCandidates.length > 0 ? `${rankedCandidates.length} Ranked` : null }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-3.5 px-1 border-b-2 font-medium text-sm flex items-center space-x-2 transition-all cursor-pointer ${
                    activeTab === tab.id
                      ? "border-indigo-600 text-indigo-600 font-semibold"
                      : "border-transparent text-slate-500 hover:text-slate-800"
                  }`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  <span>{tab.label}</span>
                  {tab.badge && (
                    <span className="text-[10px] bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded-full border border-slate-200">
                      {tab.badge}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* Main Workspace Body */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            
            {/* TAB 1: JOB DESCRIPTION INPUT */}
            {activeTab === "jd" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 space-y-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                    <div className="flex items-center justify-between mb-4">
                      <div>
                        <h2 className="text-base font-bold text-slate-900 flex items-center space-x-2">
                          <i data-lucide="file-edit" className="w-5 h-5 text-indigo-600"></i>
                          <span>Paste or Upload Job Description</span>
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">Define your role requirements, required skills, and target seniority.</p>
                      </div>

                      {/* File upload input */}
                      <label className="text-xs bg-slate-50 hover:bg-slate-100 text-slate-700 font-medium px-3.5 py-2 rounded-lg border border-slate-200 cursor-pointer flex items-center space-x-1.5 transition-colors shadow-2xs">
                        <i data-lucide="upload" className="w-3.5 h-3.5 text-slate-500"></i>
                        <span>Upload File (PDF/DOCX)</span>
                        <input type="file" accept=".pdf,.docx,.txt" className="hidden" onChange={handleJDFileUpload} />
                      </label>
                    </div>

                    {/* Presets */}
                    <div className="mb-4 flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
                      <span className="text-slate-500 font-medium whitespace-nowrap">Load Preset Role:</span>
                      {sampleJDs.map(jd => (
                        <button
                          key={jd.id}
                          onClick={() => handleSelectPresetJD(jd.id)}
                          className={`px-3 py-1.5 rounded-lg transition-all whitespace-nowrap cursor-pointer font-medium ${
                            selectedJdId === jd.id
                              ? "bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-2xs"
                              : "bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200"
                          }`}
                        >
                          {jd.title}
                        </button>
                      ))}
                    </div>

                    <textarea
                      value={jdText}
                      onChange={(e) => setJdText(e.target.value)}
                      placeholder="Paste Job Description text here..."
                      rows={14}
                      className="w-full bg-slate-50 text-slate-800 text-xs sm:text-sm font-mono p-4 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white resize-none custom-scrollbar transition-colors leading-relaxed"
                    ></textarea>

                    <div className="mt-4 flex justify-end">
                      <button
                        onClick={handleAnalyzeJD}
                        disabled={isParsingJD || !jdText.trim()}
                        className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-xl text-xs font-semibold flex items-center space-x-2 shadow-xs transition-all cursor-pointer"
                      >
                        {isParsingJD ? (
                          <>
                            <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                            <span>Extracting Requirements...</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="zap" className="w-4 h-4"></i>
                            <span>Analyze Job Description & Extract Requirements</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Extracted JD Info Card */}
                <div className="space-y-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs h-full flex flex-col">
                    <div className="flex items-center space-x-2 mb-4 pb-3 border-b border-slate-100">
                      <i data-lucide="check-circle-2" className="w-5 h-5 text-emerald-600"></i>
                      <h3 className="text-base font-bold text-slate-900">Extracted Requirements</h3>
                    </div>

                    {parsedJD ? (
                      <div className="space-y-4 flex-1 text-xs">
                        <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                          <span className="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Target Position</span>
                          <span className="text-sm font-bold text-slate-900 block">{parsedJD.title}</span>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                            <span className="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Required Exp</span>
                            <span className="text-sm font-bold text-indigo-600">{parsedJD.min_experience_years}+ Years</span>
                          </div>
                          <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                            <span className="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Education</span>
                            <span className="text-sm font-bold text-slate-800 truncate">{parsedJD.required_education}</span>
                          </div>
                        </div>

                        <div>
                          <span className="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-2">
                            Extracted Core Skills ({parsedJD.required_skills?.length || 0})
                          </span>
                          <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scrollbar p-1">
                            {parsedJD.required_skills?.map((skill, idx) => (
                              <span key={idx} className="bg-indigo-50 text-indigo-700 border border-indigo-200/80 px-2.5 py-0.5 rounded-md font-semibold text-[11px]">
                                {skill}
                              </span>
                            ))}
                          </div>
                        </div>

                        {parsedJD.responsibilities && parsedJD.responsibilities.length > 0 && (
                          <div className="pt-2">
                            <span className="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-2">Key Responsibilities</span>
                            <ul className="space-y-1.5 text-slate-600 text-[11px] max-h-36 overflow-y-auto custom-scrollbar">
                              {parsedJD.responsibilities.map((r, i) => (
                                <li key={i} className="flex items-start space-x-2">
                                  <span className="text-indigo-600 font-bold">•</span>
                                  <span>{r}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}

                        <div className="pt-4 mt-auto">
                          <button
                            onClick={() => setActiveTab("resumes")}
                            className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold text-xs flex items-center justify-center space-x-1 transition-all cursor-pointer shadow-xs"
                          >
                            <span>Proceed to Resume Upload</span>
                            <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-400">
                        <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3 text-slate-400">
                          <i data-lucide="file-question" className="w-6 h-6"></i>
                        </div>
                        <p className="text-xs text-slate-500 max-w-xs">Click "Analyze Job Description" to parse requirements and view skills taxonomy.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: RESUME BATCH UPLOAD */}
            {activeTab === "resumes" && (
              <div className="space-y-6">
                <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                      <h2 className="text-base font-bold text-slate-900 flex items-center space-x-2">
                        <span>Batch Resume Ingestion</span>
                        <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full border border-slate-200 font-semibold">
                          10+ Resumes Batch Enabled
                        </span>
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">Upload resumes in batch (PDF and DOCX). The system extracts contact details, experience, education, and skills.</p>
                    </div>

                    <div className="flex items-center space-x-3">
                      <button
                        onClick={() => handleLoadDemoDataset(selectedJdId)}
                        className="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200/80 rounded-xl text-xs font-semibold flex items-center space-x-2 transition-all cursor-pointer shadow-2xs"
                      >
                        <i data-lucide="files" className="w-4 h-4"></i>
                        <span>Load 12 Sample Resumes</span>
                      </button>
                      {uploadedResumes.length > 0 && (
                        <button
                          onClick={() => setUploadedResumes([])}

                    <button
                      onClick={() => setCandidateModalTab("skills")}
                      className={`py-3 px-4 font-bold border-b-2 cursor-pointer transition-colors ${
                        candidateModalTab === "skills"
                          ? "border-indigo-600 text-indigo-600"
                          : "border-transparent text-slate-500 hover:text-slate-800"
                      }`}
                    >
                      Skills Comparison Matrix
                    </button>
                    <button
                      onClick={() => setCandidateModalTab("resume")}
                      className={`py-3 px-4 font-bold border-b-2 cursor-pointer transition-colors ${
                        candidateModalTab === "resume"
                          ? "border-indigo-600 text-indigo-600"
                          : "border-transparent text-slate-500 hover:text-slate-800"
                      }`}
                    >
                      Extracted Resume Text
                    </button>
                  </div>

                  {/* Modal Body */}
                  <div className="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6 text-xs">
                    
                    {candidateModalTab === "analysis" && (
                      <>
                        {/* Score Metric Cards */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                            <span className="text-slate-500 text-[10px] uppercase font-bold block mb-1">Skill Match</span>
                            <span className="text-xl font-extrabold text-emerald-700">
                              {selectedCandidate.explanation?.metrics_breakdown?.skill_match_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-400 block mt-0.5">Weight: 45%</span>
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                            <span className="text-slate-500 text-[10px] uppercase font-bold block mb-1">Semantic Fit</span>
                            <span className="text-xl font-extrabold text-indigo-600">
                              {selectedCandidate.explanation?.metrics_breakdown?.semantic_similarity_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-400 block mt-0.5">SentenceTransformers (35%)</span>
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                            <span className="text-slate-500 text-[10px] uppercase font-bold block mb-1">Experience</span>
                            <span className="text-xl font-extrabold text-amber-700">
                              {selectedCandidate.explanation?.metrics_breakdown?.experience_alignment_percentage}%
                            </span>
                            <span className="text-[10px] text-slate-400 block mt-0.5">Weight: 15%</span>
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                            <span className="text-slate-500 text-[10px] uppercase font-bold block mb-1">Education</span>
                            <span className="text-xl font-extrabold text-purple-700">
                              {selectedCandidate.explanation?.metrics_breakdown?.education_score}%
                            </span>
                            <span className="text-[10px] text-slate-400 block mt-0.5">Weight: 5%</span>
                          </div>
                        </div>

                        {/* Experience Comparison Bar */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80">
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-slate-800 font-bold text-xs flex items-center space-x-1.5">
                              <i data-lucide="clock" className="w-3.5 h-3.5 text-indigo-600"></i>
                              <span>Experience Comparison</span>
                            </span>
                            <span className="text-slate-500 text-[11px]">
                              Candidate: <strong className="text-slate-900">{selectedCandidate.experience_display}</strong> vs Required: <strong className="text-indigo-600">{parsedJD?.min_experience_years || 3}+ Years</strong>
                            </span>
                          </div>
                          <div className="w-full bg-slate-200 rounded-full h-2.5 relative overflow-hidden">
                            <div
                              className="h-full bg-indigo-600 rounded-full"
                              style={{
                                width: `${Math.min(100, (selectedCandidate.experience_years / Math.max(1, (parsedJD?.min_experience_years || 3) * 1.5)) * 100)}%`
                              }}
                            ></div>
                          </div>
                        </div>

                        {/* Summary & Reasoning Behind Score (Module 5 Requirement) */}
                        <div className="space-y-4">
                          <div className="bg-indigo-50/50 border border-indigo-200/80 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-indigo-800 font-bold mb-1 text-xs">
                              <i data-lucide="info" className="w-4 h-4"></i>
                              <span>Executive Evaluation Summary</span>
                            </div>
                            <p className="text-slate-700 text-xs leading-relaxed">{selectedCandidate.explanation?.summary}</p>
                          </div>

                          {/* Strengths */}
                          <div className="bg-emerald-50/50 border border-emerald-200/80 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-emerald-800 font-bold mb-2 text-xs">
                              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-600"></i>
                              <span>Key Matching Strengths</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.strengths.map((str, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-700 text-xs">
                                  <span className="text-emerald-600 font-bold">•</span>
                                  <span>{str}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          {/* Gaps */}
                          <div className="bg-amber-50/50 border border-amber-200/80 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-amber-800 font-bold mb-2 text-xs">
                              <i data-lucide="alert-triangle" className="w-4 h-4 text-amber-600"></i>
                              <span>Identified Gaps & Missing Skills</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.gaps.map((gap, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-700 text-xs">
                                  <span className="text-amber-600 font-bold">•</span>
                                  <span>{gap}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          {/* Suggested Interview Probes */}
                          <div className="bg-purple-50/50 border border-purple-200/80 p-4 rounded-xl">
                            <div className="flex items-center space-x-2 text-purple-800 font-bold mb-2 text-xs">
                              <i data-lucide="help-circle" className="w-4 h-4 text-purple-600"></i>
                              <span>Recommended Technical Interview Focus</span>
                            </div>
                            <ul className="space-y-1.5">
                              {selectedCandidate.explanation?.interview_focus.map((q, idx) => (
                                <li key={idx} className="flex items-start space-x-2 text-slate-700 text-xs">
                                  <span className="text-purple-600 font-bold">•</span>
                                  <span>{q}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      </>
                    )}

                    {candidateModalTab === "skills" && (
                      <div className="space-y-5">
                        {/* Matched Skills */}
                        <div>
                          <span className="text-emerald-800 font-bold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="check" className="w-4 h-4 text-emerald-600"></i>
                            <span>Matched Required Skills ({selectedCandidate.matched_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.matched_skills.map((s, idx) => (
                              <span key={idx} className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-lg text-xs font-semibold">
                                ✓ {s}
                              </span>
                            ))}
                            {selectedCandidate.matched_skills.length === 0 && (
                              <span className="text-slate-400 italic">No direct matches.</span>
                            )}
                          </div>
                        </div>

                        {/* Missing Skills */}
                        <div>
                          <span className="text-rose-800 font-bold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="x" className="w-4 h-4 text-rose-600"></i>
                            <span>Missing Required Skills ({selectedCandidate.missing_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.missing_skills.map((s, idx) => (
                              <span key={idx} className="bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-lg text-xs font-semibold">
                                ✗ {s}
                              </span>
                            ))}
                            {selectedCandidate.missing_skills.length === 0 && (
                              <span className="text-emerald-700 font-semibold">All required skills present!</span>
                            )}
                          </div>
                        </div>

                        {/* Bonus Skills */}
                        <div>
                          <span className="text-purple-800 font-bold text-xs flex items-center space-x-1.5 mb-2">
                            <i data-lucide="plus-circle" className="w-4 h-4 text-purple-600"></i>
                            <span>Additional / Bonus Skills ({selectedCandidate.bonus_skills.length})</span>
                          </span>
                          <div className="flex flex-wrap gap-2">
                            {selectedCandidate.bonus_skills.map((s, idx) => (
                              <span key={idx} className="bg-purple-50 text-purple-700 border border-purple-200 px-3 py-1 rounded-lg text-xs font-medium">
                                + {s}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    {candidateModalTab === "resume" && (
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs font-mono text-slate-800 whitespace-pre-wrap max-h-96 overflow-y-auto custom-scrollbar leading-relaxed">
                        {selectedCandidate.raw_text || "No raw text available."}
                      </div>
                    )}

                  </div>

                  {/* Modal Footer */}
                  <div className="p-4 border-t border-slate-200 bg-slate-50/80 flex items-center justify-between text-xs">
                    <span className="text-slate-500 font-mono">Candidate ID: {selectedCandidate.id}</span>
                    <button
                      onClick={() => setSelectedCandidate(null)}
                      className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-semibold cursor-pointer shadow-2xs"
                    >
                      Close Analysis
                    </button>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* Clean Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-4 px-6 text-center text-xs text-slate-500">
            MatchWise AI • Professional AI-Based Resume Matching & Candidate Ranking Platform
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
